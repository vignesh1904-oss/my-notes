<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Notes</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#7a2ea8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Notes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#faf9fb;--panel:#fff;--side:#f3eff7;--ink:#1f1b24;--mute:#6f677a;--line:#e3dce9;--accent:#7a2ea8;--accent2:#ead9f5;--danger:#c0392b;--hi:#f1e6f8}
@media (prefers-color-scheme:dark){:root{--bg:#17141b;--panel:#1f1b24;--side:#241f2b;--ink:#ece8f1;--mute:#a79eb3;--line:#38303f;--accent:#c58cf0;--accent2:#3a2b48;--danger:#ff7b6b;--hi:#2d2436}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:flex;height:100dvh}
aside{width:300px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{display:flex;align-items:center;gap:4px;padding:12px 10px 6px 14px}
.side-h b{flex:1;font-size:18px;color:var(--accent)}
.ib{min-width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.ib:hover{background:var(--accent2)}
#q{margin:4px 12px 8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
#tree{flex:1;overflow:auto;padding:0 6px 12px}
.tr{display:flex;align-items:center;gap:6px;padding:7px 4px 7px 10px;border-radius:9px;cursor:pointer}
.tr:hover{background:var(--hi)}
.tr.on{background:var(--accent2);font-weight:600}
.tr .ic{flex:none;width:22px;text-align:center}
.tr .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .mo{flex:none;width:32px;height:32px;border-radius:8px;color:var(--mute)}
.tr .mo:hover{background:var(--line)}
.snip{font-size:13px;color:var(--mute);white-space:normal;display:block;font-weight:400}
.side-f{padding:8px 10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.side-f button{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.empty{color:var(--mute);padding:14px;text-align:center}
main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.top{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line)}
#menuBtn{display:none}
#crumb{flex:1;min-width:0;color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stat{font-size:12px;color:var(--mute);margin-right:4px}
.tb{display:flex;gap:2px;padding:6px 8px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--side);scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb button{flex:none;min-width:38px;height:38px;border-radius:9px;font-size:15px;padding:0 8px}
.tb button:hover,.tb button:active{background:var(--accent2)}
.tb .sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
#scroll{flex:1;overflow:auto;padding:18px 20px 120px}
.page{max-width:820px;margin:0 auto}
#title{width:100%;border:0;outline:0;background:none;color:var(--ink);font:700 28px/1.25 inherit;font-family:inherit;padding:4px 0}
#meta{color:var(--mute);font-size:13px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
#ed{outline:0;min-height:50vh;word-wrap:break-word;overflow-wrap:anywhere}
#ed h1{font-size:25px;margin:.6em 0 .3em}#ed h2{font-size:20px;margin:.6em 0 .3em}
#ed p{margin:.35em 0}
#ed img{max-width:100%;height:auto;border-radius:6px;cursor:pointer;vertical-align:middle}
#ed img.sel{outline:3px solid var(--accent)}
#ed table{border-collapse:collapse;margin:8px 0;max-width:100%}
#ed td,#ed th{border:1px solid var(--line);padding:6px 10px;min-width:60px;vertical-align:top}
#ed hr{border:0;border-top:2px solid var(--line);margin:14px 0}
#ed a{color:var(--accent)}
#ed blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:2px 12px;color:var(--mute)}
#ed ul.todo{list-style:none;padding-left:0}
#ed ul.todo li{position:relative;padding-left:30px;margin:4px 0}
#ed ul.todo li::before{content:"";position:absolute;left:3px;top:.32em;width:17px;height:17px;border:2px solid var(--accent);border-radius:5px}
#ed ul.todo li.done::before{content:"✓";background:var(--accent);color:var(--panel);font-size:12px;line-height:13px;text-align:center;font-weight:700}
#ed ul.todo li.done{text-decoration:line-through;opacity:.6}
#none{display:none;text-align:center;color:var(--mute);margin-top:18vh}
#imgbar{position:fixed;display:none;gap:2px;background:var(--ink);color:var(--panel);padding:4px;border-radius:10px;z-index:30;box-shadow:0 4px 16px #0005}
#imgbar button{min-width:40px;height:36px;border-radius:8px;color:var(--panel);font-size:15px}
#imgbar button:active{background:#fff3}
.ov{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:14px 14px 20px;max-height:88dvh;overflow:auto}
.sheet h3{margin:2px 4px 10px;font-size:16px;color:var(--mute);font-weight:600}
.mi{display:block;width:100%;text-align:left;padding:13px 12px;border-radius:10px;font-size:16px}
.mi:hover{background:var(--hi)}.mi.danger{color:var(--danger)}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.btn.pri{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:600}
.sw{display:flex;flex-wrap:wrap;gap:10px;padding:4px}
.sw button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line)}
.draw .sheet{max-width:760px;border-radius:18px}
#cv{width:100%;height:52dvh;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;display:block}
.dt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.dt button.on{background:var(--accent2);outline:2px solid var(--accent)}
.dt button{min-width:40px;height:38px;border-radius:9px;border:1px solid var(--line)}
.dt .c{width:30px;min-width:30px;height:30px;border-radius:50%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;z-index:90;display:none;max-width:90vw;font-size:14px}
#scrim{display:none}
@media (max-width:820px){
 aside{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;width:min(86vw,320px)}
 body.drawer aside{transform:none;box-shadow:4px 0 24px #0005}
 body.drawer #scrim{display:block;position:fixed;inset:0;background:#0005;z-index:35}
 #menuBtn{display:inline-flex}
 #scroll{padding:14px 14px 140px}
 #title{font-size:24px}
}
</style>
</head>
<body>
<div id="app">
 <aside id="side">
  <div class="side-h"><b>📓 My Notes</b><button class="ib" id="nf" title="New folder">📁＋</button><button class="ib" id="np" title="New page">📝＋</button></div>
  <input id="q" type="search" placeholder="Search all notes">
  <div id="tree"></div>
  <div class="side-f"><button id="bk">⬇ Backup</button><button id="rs">⬆ Restore</button></div>
 </aside>
 <div id="scrim"></div>
 <main>
  <div class="top"><button class="ib" id="menuBtn">☰</button><div id="crumb"></div><span id="stat"></span><button class="ib" id="cloud" style="font-size:13px;padding:0 8px" title="Sync across devices">☁︎</button><button class="ib" id="more" title="More">⋯</button></div>
  <div class="tb" id="tb">
   <button data-c="undo" title="Undo">↶</button><button data-c="redo" title="Redo">↷</button><span class="sep"></span>
   <button data-c="b" title="Bold"><b>B</b></button><button data-c="i" title="Italic"><i>I</i></button><button data-c="u" title="Underline"><u>U</u></button><button data-c="s" title="Strike"><s>S</s></button>
   <button data-c="hl" title="Highlight">🖍</button><button data-c="color" title="Text colour"><span style="color:#c0392b;font-weight:700">A</span></button><span class="sep"></span>
   <button data-c="h1">H1</button><button data-c="h2">H2</button><button data-c="p">¶</button><button data-c="quote">❝</button><span class="sep"></span>
   <button data-c="ul" title="Bullets">• ≡</button><button data-c="ol" title="Numbers">1.≡</button><button data-c="todo" title="Checklist">☑</button><button data-c="outdent">⇤</button><button data-c="indent">⇥</button><span class="sep"></span>
   <button data-c="img" title="Insert picture">🖼</button><button data-c="draw" title="Draw / handwrite">✏️</button><button data-c="pdf" title="Import PDF">📄</button><button data-c="table" title="Table">▦</button><button data-c="link" title="Link">🔗</button><button data-c="hr" title="Divider">―</button><button data-c="date" title="Date & time">🕒</button><button data-c="clear" title="Clear formatting">⌫</button>
  </div>
  <div id="scroll"><div class="page">
   <div id="none">Select a page on the left, or create a new one.</div>
   <div id="doc"><input id="title" placeholder="Title"><div id="meta"></div><div id="ed" contenteditable="true" spellcheck="true"></div></div>
  </div></div>
 </main>
</div>
<div id="imgbar"><button data-i="-">－</button><button data-i="+">＋</button><button data-i="full">⤢</button><button data-i="del">🗑</button></div>
<div id="toast"></div>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fPdf" accept="application/pdf,.pdf" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let nodes=[],cur=null,activeFolder=null,idb=null,saved=null,selImg=null;
const ed=$('#ed'),titleEl=$('#title');

/* ---------- storage (IndexedDB on this device) ---------- */
function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('notesapp',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('nodes'))d.createObjectStore('nodes',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
const strip=n=>{const o={};for(const k in n)if(k[0]!=='_')o[k]=n[k];return o};
function idbPut(n,quiet){if(!quiet){n.updated=Date.now();markDirty(n.id);syncSoon()}return new Promise(res=>{if(!idb)return res();try{const t=idb.transaction('nodes','readwrite');t.objectStore('nodes').put(strip(n));t.oncomplete=()=>res();t.onerror=()=>{toast('Could not save (storage full?)');res()}}catch(e){res()}})}
function idbDel(ids){return new Promise(res=>{if(!idb)return res();try{const t=idb.transaction('nodes','readwrite');ids.forEach(i=>t.objectStore('nodes').delete(i));t.oncomplete=()=>res()}catch(e){res()}})}
function idbAll(){return new Promise(res=>{if(!idb)return res([]);try{const r=idb.transaction('nodes').objectStore('nodes').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])}catch(e){res([])}})}

/* ---------- helpers ---------- */
let tt;function toast(m,ms=2500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);if(ms)tt=setTimeout(()=>t.style.display='none',ms)}
function status(s){$('#stat').textContent=s}
function cleanHTML(h){const d=new DOMParser().parseFromString('<body>'+h,'text/html');d.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base').forEach(x=>x.remove());d.body.querySelectorAll('*').forEach(x=>{[...x.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith('on')||(['href','src'].includes(n)&&v.startsWith('javascript:')))x.removeAttribute(a.name)})});return d.body.innerHTML}
function plain(n){if(n._t==null){const d=document.createElement('div');d.innerHTML=cleanHTML(n.html||'');n._t=(n.title+' '+d.textContent).replace(/\s+/g,' ')}return n._t}
function sheet(title,build,dismiss){const o=el('div','ov'),s=el('div','sheet'),h=el('h3'),b=el('div');h.textContent=title;s.append(h,b);o.appendChild(s);const close=()=>o.remove();o.addEventListener('click',e=>{if(e.target===o){close();dismiss&&dismiss()}});document.body.appendChild(o);build(b,close);return close}
function menu(title,items){sheet(title,(b,close)=>items.forEach(it=>{const x=el('button','mi'+(it.danger?' danger':''));x.textContent=it.label;x.onclick=()=>{close();it.fn&&it.fn()};b.appendChild(x)}))}
function ask(title,val='',ph=''){return new Promise(res=>sheet(title,(b,close)=>{const i=el('input','inp');i.value=val;i.placeholder=ph;const r=el('div','row'),no=el('button','btn'),ok=el('button','btn pri');no.textContent='Cancel';ok.textContent='OK';no.onclick=()=>{close();res(null)};ok.onclick=()=>{close();res(i.value)};i.onkeydown=e=>{if(e.key==='Enter')ok.click()};r.append(no,ok);b.append(i,r);setTimeout(()=>{i.focus();i.select()},60)},()=>res(null)))}
function yesno(msg,label='Delete'){return new Promise(res=>sheet(msg,(b,close)=>{const r=el('div','row'),no=el('button','btn'),ok=el('button','btn pri');no.textContent='Cancel';ok.textContent=label;no.onclick=()=>{close();res(false)};ok.onclick=()=>{close();res(true)};r.append(no,ok);b.append(r)},()=>res(false)))}
function download(name,data){return (async()=>{let d=null;try{if(window.claude&&claude.use)d=await claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:name,data});toast('Saved '+name)}catch(e){if(!e||e.code!=='declined')toast('Could not save here: '+((e&&e.message)||'unavailable'),4000)}return}
 const blob=data instanceof Blob?data:new Blob([data]);const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
 if(/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)){try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)})()}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}
const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});

/* ---------- tree ---------- */
const kids=p=>nodes.filter(n=>{const q=n.parent||null;return p===null?(!q||!nodes.some(z=>z.id===q)):q===p}).sort((a,b)=>(a.type===b.type?0:a.type==='folder'?-1:1)||a.created-b.created);
function renderTree(){const t=$('#tree');t.textContent='';const q=$('#q').value.trim().toLowerCase();
 if(q){const hits=nodes.filter(n=>n.type==='page'&&plain(n).toLowerCase().includes(q));if(!hits.length){t.innerHTML='<div class="empty">No matches</div>';return}
  hits.forEach(n=>{const r=el('div','tr'+(cur&&cur.id===n.id?' on':''));const ic=el('span','ic');ic.textContent='📄';const w=el('span','tt');w.style.whiteSpace='normal';const a=el('div');a.textContent=n.title;const s=el('span','snip');const txt=plain(n),i=txt.toLowerCase().indexOf(q);s.textContent=(i>40?'…':'')+txt.slice(Math.max(0,i-40),i+80);w.append(a,s);r.append(ic,w);r.onclick=()=>openPage(n.id);t.appendChild(r)});return}
 if(!nodes.length){t.innerHTML='<div class="empty">No notes yet</div>';return}
 (function walk(p,d){kids(p).forEach(n=>{const r=el('div','tr'+(cur&&cur.id===n.id?' on':'')+(n.type==='folder'&&activeFolder===n.id?' on':''));r.style.paddingLeft=(10+d*16)+'px';
  const ic=el('span','ic');ic.textContent=n.type==='folder'?(n.open?'📂':'📁'):'📄';const w=el('span','tt');w.textContent=n.title;const mo=el('button','mo');mo.textContent='⋯';
  mo.onclick=e=>{e.stopPropagation();itemMenu(n)};r.append(ic,w,mo);
  r.onclick=()=>{if(n.type==='folder'){n.open=!n.open;activeFolder=n.id;idbPut(n,true);renderTree()}else openPage(n.id)};t.appendChild(r);
  if(n.type==='folder'&&n.open)walk(n.id,d+1)})})(null,0)}
function descendants(id){const out=[id];kids(id).forEach(k=>out.push(...descendants(k.id)));return out}
function itemMenu(n){const it=[];
 if(n.type==='folder'){it.push({label:'📝 New page here',fn:()=>newPage(n.id)},{label:'📁 New subfolder',fn:()=>newFolder(n.id)})}
 it.push({label:'✏️ Rename',fn:async()=>{const v=await ask('Rename',n.title);if(v&&v.trim()){n.title=v.trim();if(cur&&cur.id===n.id)titleEl.value=n.title;await idbPut(n);renderTree();crumb()}}},
  {label:'📂 Move to…',fn:()=>moveDlg(n)},{label:'🗑 Delete',danger:true,fn:()=>delNode(n)});menu(n.title,it)}
function moveDlg(n){const bad=new Set(n.type==='folder'?descendants(n.id):[]);
 sheet('Move “'+n.title+'” to',(b,close)=>{const add=(label,pid,d)=>{const x=el('button','mi');x.style.paddingLeft=(12+d*16)+'px';x.textContent=label;x.onclick=async()=>{close();n.parent=pid;if(pid){const f=nodes.find(z=>z.id===pid);if(f)f.open=true}await idbPut(n);renderTree();crumb()};b.appendChild(x)};
  add('📚 Top level',null,0);(function w(p,d){kids(p).filter(k=>k.type==='folder'&&!bad.has(k.id)).forEach(k=>{add('📁 '+k.title,k.id,d);w(k.id,d+1)})})(null,1)})}
async function delNode(n){const ids=descendants(n.id);const cnt=ids.length-1;
 if(!await yesno('Delete “'+n.title+'”'+(cnt?' and everything inside it ('+cnt+' items)':'')+'? This cannot be undone.'))return;
 const del=new Set(ids);nodes=nodes.filter(x=>!del.has(x.id));for(const id of ids){const t={id,type:'x',deleted:true,updated:Date.now()};tombs[id]=t;await idbPut(t)}
 if(cur&&del.has(cur.id)){cur=null;const first=nodes.find(x=>x.type==='page');first?openPage(first.id):showNone()}renderTree()}
async function newFolder(parent=activeFolder){const v=await ask('New folder','','Folder name');if(!v||!v.trim())return;
 if(parent){const p=nodes.find(x=>x.id===parent);if(p){p.open=true;idbPut(p,true)}}
 const n={id:uid(),type:'folder',parent:parent||null,title:v.trim(),open:true,created:Date.now(),updated:Date.now()};nodes.push(n);activeFolder=n.id;await idbPut(n);renderTree()}
async function newPage(parent=activeFolder){commit();if(parent){const p=nodes.find(x=>x.id===parent);if(p){p.open=true;idbPut(p,true)}}
 const n={id:uid(),type:'page',parent:parent||null,title:'Untitled page',html:'<p><br></p>',created:Date.now(),updated:Date.now()};nodes.push(n);await idbPut(n);openPage(n.id);setTimeout(()=>{titleEl.focus();titleEl.select()},80)}

/* ---------- page open / save ---------- */
function showNone(){$('#doc').style.display='none';$('#none').style.display='block';$('#tb').style.opacity=.4;crumb()}
function openPage(id){commit();const n=nodes.find(x=>x.id===id&&x.type==='page');if(!n)return;cur=n;activeFolder=n.parent||null;
 $('#none').style.display='none';$('#doc').style.display='block';$('#tb').style.opacity=1;
 titleEl.value=n.title;ed.innerHTML=cleanHTML(n.html||'<p><br></p>');hideImgBar();meta();crumb();status('');renderTree();document.body.classList.remove('drawer');$('#scroll').scrollTop=0;
 try{localStorage.setItem('lastPage',id)}catch(e){}}
function meta(){if(!cur)return;const f=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});$('#meta').textContent='Created '+f(cur.created)+'  ·  Edited '+f(cur.updated)}
function crumb(){const parts=[];let p=cur?cur.parent:null;while(p){const f=nodes.find(x=>x.id===p);if(!f)break;parts.unshift(f.title);p=f.parent}$('#crumb').textContent=parts.concat(cur?[cur.title]:[]).join('  ›  ')}
let st;function onEdit(){if(!cur)return;status('Saving…');clearTimeout(st);st=setTimeout(commit,600)}
function commit(){clearTimeout(st);if(!cur||$('#doc').style.display==='none')return;const c=ed.cloneNode(true);c.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
 const h=c.innerHTML,t=titleEl.value.trim()||'Untitled page';if(h===cur.html&&t===cur.title)return;cur.html=h;cur.title=t;cur._t=null;cur.updated=Date.now();idbPut(cur).then(()=>status('Saved'));meta();crumb();renderTree()}
